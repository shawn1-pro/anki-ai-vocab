[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anki-ai-vocab"
version = "0.1.0"
description = "Ubuntu terminal vocabulary capture with DeepSeek and AnkiConnect"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=1.50,<3", "httpx>=0.27,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
anki-word = "anki_ai_vocab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
